apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-device-plugins-gpu
  namespace: argocd
spec:
  project: default
  sources:
    - chart: intel-device-plugins-gpu
      repoURL: https://intel.github.io/helm-charts/
      targetRevision: 0.37.1 # Replace with the Longhorn version you'd like to install or upgrade to
      helm:
        values: |
          sharedDevNum: 10
          allocationPolicy: packed
      #     kubeletPlugin:
      #       healthMonitoring:
      #         enabled: false
      #       privileged: true

      #     cdi:
      #       staticPath: /run/cdi
      #       dynamicPath: /run/cdi

      #     nodeFeatureRules:
      #       enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: intel-device-plugin
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
